<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinStock Developer Site</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f6f8fb;
      color: #162033;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    .card {
      background: #fff;
      border: 1px solid #dde5ef;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(22, 32, 51, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }
    p {
      margin: 0 0 14px;
      line-height: 1.7;
    }
    a {
      color: #0b63d1;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #eef4ff;
      padding: 2px 6px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>PinStock Developer Site</h1>
      <p>이 사이트는 PinStock 앱의 개발자 웹사이트 및 app-ads.txt 게시용 루트 페이지입니다.</p>
      <p>app-ads.txt 확인 주소: <a href="/app-ads.txt">/app-ads.txt</a></p>
      <p>AdMob 검증용 파일은 루트 경로의 <code>app-ads.txt</code> 에 게시됩니다.</p>
    </section>
  </main>
</body>
</html>
